[package]
name = "xsa"
version = "2026.10.1"
edition.workspace = true

[features]
default = ["client"]
client = ["server", "dep:xsa-client"]
server = ["dep:xsa-server"]

[dependencies]
anyhow.workspace = true
shlex = "2.0.1"
usage = { workspace = true, features = ["completions"] }
xsa-client = { workspace = true, optional = true }
xsa-commands.workspace = true
xsa-logging.workspace = true
xsa-server = { workspace = true, optional = true }
