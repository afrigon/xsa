[package]
name = "xsa"
version.workspace = true
edition.workspace = true

[features]
default = ["client"]
client = ["server", "dep:xsa-client"]
server = ["dep:xsa-server"]

[dependencies]
anyhow.workspace = true
shlex = "2.0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
usage = { workspace = true, features = ["completions"] }
xsa-client = { workspace = true, optional = true }
xsa-commands.workspace = true
xsa-server = { workspace = true, optional = true }
