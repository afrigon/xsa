[workspace]
resolver = "3"
members = ["crates/units", "crates/core", "crates/packs", "crates/proto", "crates/commands", "crates/server", "crates/client", "crates/xsa", "crates/tools", "crates/xui", "crates/xui-vulkan"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
ash = "0.38.0"
bitcode = "0.6.9"
glam = "0.33.11"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
image = { version = "0.25.10", default-features = false, features = ["exr"] }
tokio = "1.53.1"
tracing = "0.1.44"
usage = { version = "6.12.0", package = "usage-rs" }
winit = "0.30.13"
xsa-client = { path = "crates/client" }
xsa-commands = { path = "crates/commands" }
xsa-core = { path = "crates/core" }
xsa-packs = { path = "crates/packs" }
xsa-proto = { path = "crates/proto" }
xsa-server = { path = "crates/server" }
xsa-units = { path = "crates/units" }
xui = { path = "crates/xui" }
xui-vulkan = { path = "crates/xui-vulkan" }
