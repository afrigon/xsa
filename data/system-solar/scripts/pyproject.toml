[project]
name = "system-solar-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "colour-science>=0.4.7",
    "etcpak>=0.9.15",
    "numpy>=2.5.4",
    "openexr>=3.5.2",
    "pillow>=12.3.0",
    "rasterio>=1.5.2",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
sol = [
    "texture2ddecoder>=1.0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
