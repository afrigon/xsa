[package]
name = "xsa-proto"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
bitcode.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
xsa-units.workspace = true
