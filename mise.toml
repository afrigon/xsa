[tools]
"github:shader-slang/slang" = "latest"
rust = "latest"
xh = "latest"

[vars]
star_map_url = "https://svs.gsfc.nasa.gov/vis/a000000/a004800/a004851/starmap_2020_16k.exr"

[tasks.build]
description = "Build every crate in the workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Run the test suite"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt"

[tasks.lint]
description = "Lint with clippy, treating warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.shaders]
description = "Compile the base pack's Slang shaders to SPIR-V next to their sources"
sources = ["packs/base/base/resources/shaders/**/*.slang"]
outputs = ["packs/base/base/resources/shaders/*.spv"]
run = """
#!/usr/bin/env bash
set -euo pipefail
directory=packs/base/base/resources/shaders
for source in "$directory"/*.slang; do
    slangc "$source" -I "$directory" -target spirv -matrix-layout-column-major -fvk-use-entrypoint-name -o "${source%.slang}.spv"
done
"""

[tasks.dev]
description = "Run the game in a debug build; pass flags after --, e.g. --remote [::1]:1969 --fingerprint <hash>"
depends = ["shaders"]
run = "cargo run -p xsa --"

[tasks.server]
description = "Run the dedicated server; pass flags after --, e.g. --host :: --port 1969"
run = "cargo run -p xsa-server --"

[tasks.fetch-assets]
description = "Download third-party assets into assets/"
run = """
#!/usr/bin/env bash
set -euo pipefail

mkdir -p assets/deep-star-maps

if [ ! -f assets/deep-star-maps/starmap_2020_16k.exr ]; then
    xh --ignore-stdin --follow --download --output assets/deep-star-maps/starmap_2020_16k.exr '{{vars.star_map_url}}' 'Accept:*/*'
fi
cat > assets/deep-star-maps/CREDIT.txt <<'CREDIT'
Deep Star Maps 2020
NASA/Goddard Space Flight Center Scientific Visualization Studio
https://svs.gsfc.nasa.gov/4851
Gaia DR2: ESA/Gaia/DPAC. Hipparcos-2, Tycho-2: ESA.
CREDIT
"""

[tasks.convert-skybox]
description = "Convert the Deep Star Maps star map into a cube map DDS"
depends = ["fetch-assets"]
sources = ["assets/deep-star-maps/starmap_2020_16k.exr", "tools/src/main.rs"]
outputs = ["packs/system-solar/system-solar/resources/textures/skyboxes/deep-star-maps.dds"]
run = "cargo run --release -p xsa-tools --bin convert-skybox -- assets/deep-star-maps/starmap_2020_16k.exr packs/system-solar/system-solar/resources/textures/skyboxes/deep-star-maps.dds"
