[tools]
"github:shader-slang/slang" = "latest"
rust = "latest"
xh = "latest"

[vars]
server_target_directory = "target/server"
star_map_url = "https://svs.gsfc.nasa.gov/vis/a000000/a004800/a004851/starmap_2020_16k.exr"

[tasks.build]
description = "Build every crate in the workspace with the client and server"
depends = ["shaders"]
usage = 'flag "--release" help="Build with optimizations"'
run = 'cargo build --workspace ${usage_release:+--release}'

[tasks.build-server]
description = "Build the server-only xsa binary into target/server"
usage = 'flag "--release" help="Build with optimizations"'
run = 'cargo build -p xsa --no-default-features --features server --target-dir {{vars.server_target_directory}} ${usage_release:+--release}'

[tasks.test]
description = "Run the test suite"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint every crate with clippy, with the client and server-only, treating warnings as errors"
run = [
    "cargo clippy --workspace --all-targets -- -D warnings",
    "cargo clippy -p xsa --all-targets --no-default-features --features server --target-dir {{vars.server_target_directory}} -- -D warnings",
]

[tasks.shaders]
description = "Compile the base pack's Slang shaders to SPIR-V next to their sources and validate the output"
sources = ["data/base/base/resources/shaders/**/*.slang"]
outputs = ["data/base/base/resources/shaders/*.spv"]
run = """
#!/usr/bin/env bash
set -euo pipefail
directory=data/base/base/resources/shaders
for source in "$directory"/*.slang; do
    slangc "$source" -I "$directory" -target spirv -matrix-layout-column-major -fvk-use-entrypoint-name -o "${source%.slang}.spv"
    spirv-val --target-env vulkan1.3 "${source%.slang}.spv"
done
"""

[tasks.client]
description = "Run the game with an integrated server; --release first for an optimized build, then xsa arguments after --, e.g. -- --remote [::1]:1969 --fingerprint <hash>"
depends = ["shaders"]
# No usage spec: mise would take --help meant for xsa as a request for this task's help.
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -p xsa "${release[@]}" -- client "$@"
"""

[tasks.ipc]
description = "Send a command to a running instance; --release first to use the optimized build, e.g. mise run ipc -- camera target mars"
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -q -p xsa "${release[@]}" -- ipc "$@"
"""

[tasks.server]
description = "Run the server-only build as a dedicated server; --release first for an optimized build, then xsa server arguments after --, e.g. -- --host :: --port 1969"
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -p xsa --no-default-features --features server --target-dir {{vars.server_target_directory}} "${release[@]}" -- server "$@"
"""

[tasks.fetch-assets]
description = "Download third-party assets into assets/"
run = """
#!/usr/bin/env bash
set -euo pipefail

mkdir -p assets/deep-star-maps

if [ ! -f assets/deep-star-maps/starmap_2020_16k.exr ]; then
    xh --ignore-stdin --follow --download --output assets/deep-star-maps/starmap_2020_16k.exr '{{vars.star_map_url}}' 'Accept:*/*'
fi
cat > assets/deep-star-maps/CREDIT.txt <<'CREDIT'
Deep Star Maps 2020
NASA/Goddard Space Flight Center Scientific Visualization Studio
https://svs.gsfc.nasa.gov/4851
Gaia DR2: ESA/Gaia/DPAC. Hipparcos-2, Tycho-2: ESA.
CREDIT
"""

[tasks.convert-skybox]
description = "Convert the Deep Star Maps star map into a cube map DDS"
depends = ["fetch-assets"]
sources = ["assets/deep-star-maps/starmap_2020_16k.exr", "tools/src/main.rs"]
outputs = ["data/system-solar/system-solar/resources/textures/skyboxes/deep-star-maps.dds"]
run = "cargo run --release -p xsa-tools --bin convert-skybox -- assets/deep-star-maps/starmap_2020_16k.exr data/system-solar/system-solar/resources/textures/skyboxes/deep-star-maps.dds"
