[tools]
"conda:clang-format" = "latest"
"github:shader-slang/slang" = "latest"
rust = "latest"

[vars]
server_target_directory = "target/server"

[tasks.build]
description = "Build every crate in the workspace with the client and server"
depends = ["shaders"]
usage = 'flag "--release" help="Build with optimizations"'
run = 'cargo build --workspace ${usage_release:+--release}'

[tasks.build-server]
description = "Build the server-only xsa binary into target/server"
usage = 'flag "--release" help="Build with optimizations"'
run = 'cargo build -p xsa --no-default-features --features server --target-dir {{vars.server_target_directory}} ${usage_release:+--release}'

[tasks.test]
description = "Run the test suite"
depends = ["shaders"]
run = "cargo test --workspace"

[tasks.fmt]
description = "Format the Rust sources and the Slang shaders"
run = [
    "cargo fmt --all",
    """
#!/usr/bin/env bash
set -euo pipefail
# clang-format picks the C# language from the assumed name, which it only reads for standard input.
find data/base/base/resources/shaders crates/xui-vulkan/shaders -name '*.slang' | while read -r source; do
    clang-format --assume-filename="$source.cs" < "$source" > "$source.formatted"
    mv "$source.formatted" "$source"
done
""",
]

[tasks.lint]
description = "Lint every crate with clippy, with the client and server-only, treating warnings as errors, and check the shaders are formatted"
depends = ["shaders"]
run = [
    "cargo clippy --workspace --all-targets -- -D warnings",
    "cargo clippy -p xsa --all-targets --no-default-features --features server --target-dir {{vars.server_target_directory}} -- -D warnings",
    """
#!/usr/bin/env bash
set -euo pipefail
find data/base/base/resources/shaders crates/xui-vulkan/shaders -name '*.slang' | while read -r source; do
    if ! clang-format --assume-filename="$source.cs" --dry-run --Werror < "$source" 2> /dev/null; then
        echo "$source is not formatted, run mise run fmt" >&2
        exit 1
    fi
done
""",
]

[tasks.docs]
description = "Build the protocol reference from the proto crate's documentation"
usage = 'flag "--open" help="Open the reference in a browser"'
run = 'cargo doc -p xsa-proto --no-deps ${usage_open:+--open}'

[tasks.shaders]
description = "Compile the base pack's and xui-vulkan's Slang shaders to SPIR-V next to their sources and validate the output"
sources = ["data/base/base/resources/shaders/**/*.slang", "crates/xui-vulkan/shaders/*.slang"]
outputs = ["data/base/base/resources/shaders/**/*.spv", "crates/xui-vulkan/shaders/*.spv"]
run = """
#!/usr/bin/env bash
set -euo pipefail
options=(-target spirv -matrix-layout-column-major -fvk-use-entrypoint-name)
compile() {
    slangc "$@"
    spirv-val --target-env vulkan1.3 "${@: -1}"
}
# A program is a file with entry points; every other file is a module it imports.
for root in data/base/base/resources/shaders crates/xui-vulkan/shaders; do
    for source in $(grep -rl --include='*.slang' '\\[shader(' "$root"); do
        compile "$source" -I "$root" "${options[@]}" -o "${source%.slang}.spv"
    done
done
"""

[tasks.client]
description = "Run the game with an integrated server; --release first for an optimized build, then xsa arguments after --, e.g. -- --remote [::1]:1969 --fingerprint <hash>"
depends = ["shaders"]
# No usage spec: mise would take --help meant for xsa as a request for this task's help.
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -p xsa "${release[@]}" -- client "$@"
"""

[tasks.ipc]
description = "Send a command to a running xsa process; --release first to use the optimized build, e.g. mise run ipc -- camera target mars"
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -q -p xsa "${release[@]}" -- ipc "$@"
"""

[tasks.launchpad]
description = "Run launchpad, the instance and pack manager; --release first for an optimized build, then launchpad arguments after --, e.g. -- completion fish"
# No usage spec: mise would take --help meant for launchpad as a request for this task's help.
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -q -p xsa-launchpad "${release[@]}" -- "$@"
"""

[tasks.server]
description = "Run the server-only build as a dedicated server; --release first for an optimized build, then xsa server arguments after --, e.g. -- --host :: --port 1969"
run = """
#!/usr/bin/env bash
set -euo pipefail
release=()
if [[ "${1:-}" == "--release" ]]; then release=(--release); shift; fi
cargo run -p xsa --no-default-features --features server --target-dir {{vars.server_target_directory}} "${release[@]}" -- server "$@"
"""

[tasks.generate]
description = "Generate a pack's assets from their sources; the pack, then its scripts' arguments after --, e.g. -- system-solar luna skybox, or -- base-surfaces --density 1024"
# No usage spec: mise would take --help meant for the pack's scripts as a request for this task's help.
run = """
#!/usr/bin/env bash
set -euo pipefail
pack="${1:?the pack to generate, e.g. system-solar}"
shift
cd "data/$pack/scripts"
uv run build.py "$@"
"""
